  };
  function translate(value) {
    const key = value.trim();
    let replacement = translations[key];
    if (!replacement && /^Made with Streamlit v\s*/.test(key))
      replacement = key.replace(/^Made with Streamlit v\s*/, 'Streamlit バージョン ');
    if (!replacement && /^\d+\s*[KMG]B per file$/.test(key))
      replacement = '1ファイルあたり ' + key.replace(/ per file$/, '');
    if (!replacement && /^Limit \d+\s*[KMG]B per file/.test(key))
      replacement = key.replace(/^Limit (\d+\s*[KMG]B) per file/, '1ファイルあたり上限 $1');
    if (!replacement && key.startsWith('Help for '))
      replacement = key.slice(9) + 'の説明';
    return replacement ? value.replace(key, replacement) : value;
  }
  const surfaces = 'header, [role="menu"], [role="dialog"], [role="tooltip"], '
    + '[data-testid="stMainMenuPopover"], [data-testid="stFileUploader"], '
    + '[data-testid="stToolbar"], [data-testid="stStatusWidget"]';
  function apply() {
    document.querySelectorAll(surfaces).forEach(root => {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      while (walker.nextNode()) {
        const node = walker.currentNode;
        // Preserve icon ligatures, code samples, user text, and script/style content.
        if (node.parentElement?.closest('script, style, pre, code, [data-testid="stIconMaterial"]')) continue;
        const next = translate(node.nodeValue);
        if (next !== node.nodeValue) node.nodeValue = next;
      }
    });
    document.querySelectorAll('button, input, [role="menu"], [role="combobox"], a').forEach(el => {
      for (const attr of ['aria-label', 'title']) {

        if (value && translate(value) !== value) el.setAttribute(attr, translate(value));
      }
    });
  }
  window.pdf2markdownJapaneseUI?.disconnect();
  let queued = false;
  const observer = new MutationObserver(() => {
    if (!queued) {
      queued = true;
      requestAnimationFrame(() => { queued = false; apply(); });
    }
  });
  observer.observe(document.body, {childList: true, subtree: true, characterData: true});
  window.pdf2markdownJapaneseUI = observer;
  apply();
})();
